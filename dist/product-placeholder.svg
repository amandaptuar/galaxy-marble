<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfaf7" />
      <stop offset="50%" stop-color="#f5f1e8" />
      <stop offset="100%" stop-color="#ede7dc" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <pattern id="marbleVein" width="300" height="400" patternUnits="userSpaceOnUse">
      <path d="M-50,150 Q100,50 200,220 T400,300" fill="none" stroke="#e4ded3" stroke-width="1.5" opacity="0.6" />
      <path d="M50,-50 Q180,180 120,320 T300,450" fill="none" stroke="#dfd7cb" stroke-width="1" opacity="0.4" />
      <path d="M150,50 Q80,200 240,350" fill="none" stroke="#e8e2d8" stroke-width="2" opacity="0.5" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGrad)" />
  <rect width="600" height="800" fill="url(#marbleVein)" />

  <!-- Outer Luxury Border -->
  <rect x="24" y="24" width="552" height="752" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4" rx="8" />
  <rect x="34" y="34" width="532" height="732" fill="none" stroke="#d4af37" stroke-width="0.75" stroke-dasharray="6,4" opacity="0.3" rx="6" />

  <!-- Center Decorative Diamond Badge -->
  <g transform="translate(300, 330)">
    <!-- Outer Glow Circle -->
    <circle r="72" fill="#ffffff" opacity="0.7" />
    <circle r="72" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
    <circle r="64" fill="none" stroke="#d4af37" stroke-width="0.75" stroke-dasharray="4,3" opacity="0.5" />

    <!-- Stone / Sculpture Icon -->
    <path d="M0,-36 L32,-10 L20,32 L-20,32 L-32,-10 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" />
    <path d="M-32,-10 L32,-10 M0,-36 L0,32 M-20,32 L0,-10 L20,32" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.7" />
    <circle cx="0" cy="-6" r="3" fill="#b8860b" />
  </g>

  <!-- Typography -->
  <text x="300" y="445" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" fill="#2b2d30" text-anchor="middle" letter-spacing="4">
    GALAXY MARBLE
  </text>
  
  <text x="300" y="475" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#b8860b" text-anchor="middle" letter-spacing="3">
    PRODUCT IMAGE PLACEHOLDER
  </text>

  <line x1="220" y1="495" x2="380" y2="495" stroke="#d4af37" stroke-width="1" opacity="0.5" />

  <text x="300" y="525" font-family="'Montserrat', sans-serif" font-size="10" font-weight="500" fill="#7a7d84" text-anchor="middle" letter-spacing="1.5">
    3:4 ASPECT RATIO • 600 × 800 PX
  </text>

  <text x="300" y="548" font-family="'Cormorant Garamond', Georgia, serif" font-size="13" font-style="italic" fill="#8c8f96" text-anchor="middle">
    Handcrafted Makrana Marble Collection
  </text>

  <!-- Corner Flourishes -->
  <path d="M44,60 L60,44 M44,44 L60,44 L44,60" fill="none" stroke="#b8860b" stroke-width="1" opacity="0.5" />
  <path d="M556,60 L540,44 M556,44 L540,44 L556,60" fill="none" stroke="#b8860b" stroke-width="1" opacity="0.5" />
  <path d="M44,740 L60,756 M44,756 L60,756 L44,740" fill="none" stroke="#b8860b" stroke-width="1" opacity="0.5" />
  <path d="M556,740 L540,756 M556,756 L540,756 L556,740" fill="none" stroke="#b8860b" stroke-width="1" opacity="0.5" />
</svg>
